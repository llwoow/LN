<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 930" role="img" aria-label="图3 关断时的定性等势线"><title>图3 关断时的定性等势线</title><defs><marker id="arrow-9bfbb0fe" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}path,rect,line{vector-effect:non-scaling-stroke}</style><rect width="100%" height="100%" fill="white"/><text x="60" y="40" font-size="26" text-anchor="start" fill="#17202b" >N 沟道增强型 · 平面栅 VDMOS</text><text x="60" y="72" font-size="20" text-anchor="start" fill="#17202b" >结构尺寸不按比例，局部结构放大显示</text><rect x="60" y="280" width="1180" height="490" fill="#edf4fb" stroke="#515b68" stroke-width="1.4" /><rect x="60" y="770" width="1180" height="65" fill="#b7d4ef" stroke="#515b68" stroke-width="1.4" /><rect x="60" y="835" width="1180" height="35" fill="#606873" stroke="#515b68" stroke-width="1.4" /><rect x="60" y="164" width="1180" height="116" fill="#f2f0e9" stroke="#515b68" stroke-width="1.4" /><rect x="60" y="148" width="1180" height="16" fill="#c7ded4" stroke="#515b68" stroke-width="1.4" /><path d="M100 280 C102 342 127 370 180 370 C233 370 258 342 260 280 Z" fill="#f7e6e7" stroke="#a9616f" stroke-width="1.6" /><rect x="115" y="280" width="30" height="21" fill="#b7d4ef" stroke="#515b68" stroke-width="1.4" /><rect x="215" y="280" width="30" height="21" fill="#b7d4ef" stroke="#515b68" stroke-width="1.4" /><rect x="164" y="280" width="32" height="30" fill="#dfafb7" stroke="#515b68" stroke-width="1.4" /><rect x="135" y="195" width="90" height="85" fill="#606873" stroke="#515b68" stroke-width="1.4" /><text x="180" y="349" font-size="19" text-anchor="middle" fill="#17202b" >p-base</text><path d="M310 280 C312 342 337 370 390 370 C443 370 468 342 470 280 Z" fill="#f7e6e7" stroke="#a9616f" stroke-width="1.6" /><rect x="325" y="280" width="30" height="21" fill="#b7d4ef" stroke="#515b68" stroke-width="1.4" /><rect x="425" y="280" width="30" height="21" fill="#b7d4ef" stroke="#515b68" stroke-width="1.4" /><rect x="374" y="280" width="32" height="30" fill="#dfafb7" stroke="#515b68" stroke-width="1.4" /><rect x="345" y="195" width="90" height="85" fill="#606873" stroke="#515b68" stroke-width="1.4" /><text x="390" y="349" font-size="19" text-anchor="middle" fill="#17202b" >p-base</text><path d="M520 280 C522 342 547 370 600 370 C653 370 678 342 680 280 Z" fill="#f7e6e7" stroke="#a9616f" stroke-width="1.6" /><rect x="535" y="280" width="30" height="21" fill="#b7d4ef" stroke="#515b68" stroke-width="1.4" /><rect x="635" y="280" width="30" height="21" fill="#b7d4ef" stroke="#515b68" stroke-width="1.4" /><rect x="584" y="280" width="32" height="30" fill="#dfafb7" stroke="#515b68" stroke-width="1.4" /><rect x="555" y="195" width="90" height="85" fill="#606873" stroke="#515b68" stroke-width="1.4" /><text x="600" y="349" font-size="19" text-anchor="middle" fill="#17202b" >p-base</text><rect x="100" y="170" width="560" height="25" fill="#606873" stroke="#515b68" stroke-width="1.4" /><text x="380" y="189" font-size="19" text-anchor="middle" fill="#fff" >源极金属 S（源区与体区短接）</text><rect x="60" y="250" width="65" height="26" fill="#bcaed9" stroke="#515b68" stroke-width="1.4" /><rect x="60" y="276" width="65" height="4" fill="#f4d285" stroke="#515b68" stroke-width="1.4" /><rect x="235" y="250" width="100" height="26" fill="#bcaed9" stroke="#515b68" stroke-width="1.4" /><rect x="235" y="276" width="100" height="4" fill="#f4d285" stroke="#515b68" stroke-width="1.4" /><rect x="445" y="250" width="100" height="26" fill="#bcaed9" stroke="#515b68" stroke-width="1.4" /><rect x="445" y="276" width="100" height="4" fill="#f4d285" stroke="#515b68" stroke-width="1.4" /><rect x="655" y="250" width="65" height="26" fill="#bcaed9" stroke="#515b68" stroke-width="1.4" /><rect x="655" y="276" width="65" height="4" fill="#f4d285" stroke="#515b68" stroke-width="1.4" /><path d="M830 280 L830 299 Q830 321 850 321 Q870 321 870 299 L870 280 Z" fill="#dfafb7" stroke="#a9616f" stroke-width="1.6" /><text x="850" y="341" font-size="18" text-anchor="middle" fill="#17202b" >FR1</text><path d="M960 280 L960 299 Q960 321 980 321 Q1000 321 1000 299 L1000 280 Z" fill="#dfafb7" stroke="#a9616f" stroke-width="1.6" /><text x="980" y="341" font-size="18" text-anchor="middle" fill="#17202b" >FR2</text><path d="M1090 280 L1090 299 Q1090 321 1110 321 Q1130 321 1130 299 L1130 280 Z" fill="#dfafb7" stroke="#a9616f" stroke-width="1.6" /><text x="1110" y="341" font-size="18" text-anchor="middle" fill="#17202b" >FR3</text><path d="M765 100 L765 142" fill="none" stroke="#7d8690" stroke-width="1" stroke-dasharray="5 5"/><text x="360" y="105" font-size="22" text-anchor="middle" fill="#17202b" >有源区：三个重复条形元胞剖面</text><text x="995" y="110" font-size="23" text-anchor="middle" fill="#17202b" >终端区：P⁺ 浮置场限环</text><text x="995" y="136" font-size="20" text-anchor="middle" fill="#17202b" >（Floating Field Rings）</text><text x="650" y="808" font-size="23" text-anchor="middle" fill="#17202b" >n⁺ 衬底（重掺杂 n 型）</text><defs><linearGradient id="terminal-300" gradientUnits="userSpaceOnUse" x1="910" x2="1170"><stop stop-color="#006b86"/><stop offset="1" stop-color="#006b86" stop-opacity="0"/></linearGradient></defs><path d="M60 414.212 H650" fill="none" stroke="#006b86" stroke-width="2.6" /><path d="M650 414.212 C795 414.212 995 386.212 1170 346.212" fill="none" stroke="url(#terminal-300)" stroke-width="2" stroke-dasharray="7 6"/><text x="77" y="406.21161675113524" font-size="21" text-anchor="start" fill="#006b86" >300 V</text><defs><linearGradient id="terminal-600" gradientUnits="userSpaceOnUse" x1="910" x2="1170"><stop stop-color="#145a47"/><stop offset="1" stop-color="#145a47" stop-opacity="0"/></linearGradient></defs><path d="M60 466.655 H650" fill="none" stroke="#145a47" stroke-width="2.6" /><path d="M650 466.655 C795 466.655 995 438.655 1170 398.655" fill="none" stroke="url(#terminal-600)" stroke-width="2" stroke-dasharray="7 6"/><text x="77" y="458.6547622084393" font-size="21" text-anchor="start" fill="#145a47" >600 V</text><defs><linearGradient id="terminal-900" gradientUnits="userSpaceOnUse" x1="910" x2="1170"><stop stop-color="#9b5300"/><stop offset="1" stop-color="#9b5300" stop-opacity="0"/></linearGradient></defs><path d="M60 535.000 H650" fill="none" stroke="#9b5300" stroke-width="2.6" /><path d="M650 535.000 C795 535.000 995 507.000 1170 467.000" fill="none" stroke="url(#terminal-900)" stroke-width="2" stroke-dasharray="7 6"/><text x="77" y="527.0" font-size="21" text-anchor="start" fill="#9b5300" >900 V</text><text x="365" y="392" font-size="20" text-anchor="middle" fill="#17202b" >等势线靠近主结较密</text><text x="992" y="195" font-size="23" text-anchor="middle" fill="#17202b" >V<tspan baseline-shift="sub" font-size="70%">GS</tspan> = 0，V<tspan baseline-shift="sub" font-size="70%">DS</tspan> = 1200 V</text><text x="992" y="229" font-size="21" text-anchor="middle" fill="#17202b" >S = G = 0 V，近中性体区 ≈ 0 V</text><text x="992" y="261" font-size="21" text-anchor="middle" fill="#17202b" >浮置场限环与源极金属隔离</text><text x="964" y="591" font-size="22" text-anchor="middle" fill="#17202b" >终端区等势线仅示意</text><text x="964" y="622" font-size="21" text-anchor="middle" fill="#17202b" >实际位置需二维仿真确定</text><text x="964" y="691" font-size="19" text-anchor="middle" fill="#17202b" >耗尽边界只标出中心区的一维结果</text><defs><linearGradient id="neutral-center" gradientUnits="userSpaceOnUse" x1="515" x2="650"><stop stop-color="#eae2f5"/><stop offset="1" stop-color="#eae2f5" stop-opacity="0"/></linearGradient></defs><rect x="61" y="700" width="589" height="70" fill="url(#neutral-center)" stroke="none" stroke-width="1.4" /><path d="M60 700 H650" fill="none" stroke="#533178" stroke-width="2.6" stroke-dasharray="10 6"/><text x="77" y="690" font-size="21" text-anchor="start" fill="#533178" >1200 V · 中心区耗尽边界 y = W</text><text x="77" y="742" font-size="21" text-anchor="start" fill="#533178" >未耗尽的 n⁻ 漂移区（+1200 V，一维近似）</text><path d="M60 835 H1240" fill="none" stroke="#533178" stroke-width="3" /><text x="650" y="861" font-size="22" text-anchor="middle" fill="#fff" >D = +1200 V（背面漏极金属，全宽等势）</text><text x="60" y="904" font-size="21" text-anchor="start" fill="#17202b" >中心区采用一维未穿通近似。终端虚线渐隐表示实际延伸位置待定。</text></svg>