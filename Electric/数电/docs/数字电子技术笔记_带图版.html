    </style>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>

<body>
    <div class="container">
        <h1>数字电子技术课程笔记总结（配图版）</h1>
        
        <div class="toc">
            <h3>📚 目录</h3>
            <ul>
                <li><a href="#section1">1. 数制与编码</a></li>
                <li><a href="#section2">2. 逻辑代数基础</a></li>
                <li><a href="#section3">3. 逻辑门电路</a></li>
                <li><a href="#section4">4. 组合逻辑电路</a></li>
                <li><a href="#section5">5. 触发器</a></li>
                <li><a href="#section6">6. 时序逻辑电路</a></li>
                <li><a href="#section7">7. 存储器</a></li>
                <li><a href="#section8">8. 可编程逻辑器件</a></li>
                <li><a href="#section9">9. 数字系统设计</a></li>
            </ul>
        </div>

        <hr class="section-divider">

        <!-- 这里将插入markdown内容 -->
        <div id="content">
            <p style="text-align: center; color: #7f8c8d; font-style: italic;">
                📖 正在加载笔记内容...<br>
                💡 本版本包含完整的图表和公式渲染
            </p>
        </div>

        <script>
            // 简单的markdown到HTML转换器（基础版本）
            function convertMarkdownToHTML(markdownText) {
                let html = markdownText;
                
                // 标题转换
                html = html.replace(/^# (.*$)/gim, '<h1 id="section1">$1</h1>');
                html = html.replace(/^## (.*$)/gim, '<h2 id="section2">$1</h2>');
                html = html.replace(/^### (.*$)/gim, '<h3 id="section3">$1</h3>');
                html = html.replace(/^#### (.*$)/gim, '<h4 id="section4">$1</h4>');
                
                // 表格转换
                html = html.replace(/\|(.+)\|/gim, function(match, content) {
                    const cells = content.split('|').map(cell => cell.trim()).filter(cell => cell);
                    const isHeader = html.indexOf(match) < html.indexOf('<table>') || !html.includes('<table>');
                    const tag = isHeader ? 'th' : 'td';
                    return `<tr>${cells.map(cell => `<${tag}>${cell}</${tag}>`).join('')}</tr>`;
                });
                
                // 包围表格标签
                html = html.replace(/(<tr>.*<\/tr>\s*)+/gim, '<table>$&</table>');
                
                // 列表转换
                html = html.replace(/^\* (.+)$/gim, '<li>$1</li>');
                html = html.replace(/^- (.+)$/gim, '<li>$1</li>');
                html = html.replace(/(\n<li>.*<\/li>\n)+/gim, '<ul>$&</ul>');
                
                // 图片转换
                html = html.replace(/!\[(.*?)\]\((.*?)\)/gim, '<img src="$2" alt="$1"><div class="image-caption">$1</div>');
                
                // 链接转换
                html = html.replace(/\[(.*?)\]\((.*?)\)/gim, '<a href="$2">$1</a>');
                
                // 粗体和斜体
                html = html.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
                html = html.replace(/\*(.*?)\*/gim, '<em>$1</em>');
                
                // 代码块
                html = html.replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>');
                html = html.replace(/`([^`]+)`/gim, '<code>$1</code>');
                
                // 段落
                html = html.replace(/\n\n/gim, '</p><p>');
                html = '<p>' + html + '</p>';
                
                // 清理多余的p标签
                html = html.replace(/<p><\/p>/gim, '');
                html = html.replace(/<p>(<h[1-6]>)/gim, '$1');
                html = html.replace(/(<\/h[1-6]>)<\/p>/gim, '$1');
                html = html.replace(/<p>(<table>)/gim, '$1');
                html = html.replace(/(<\/table>)<\/p>/gim, '$1');
                html = html.replace(/<p>(<ul>)/gim, '$1');
                html = html.replace(/(<\/ul>)<\/p>/gim, '$1');
                html = html.replace(/<p>(<pre>)/gim, '$1');
                html = html.replace(/(<\/pre>)<\/p>/gim, '$1');
                html = html.replace(/<p>(<details>)/gim, '$1');
                html = html.replace(/(<\/details>)<\/p>/gim, '$1');
                
                return html;
            }
            
            // 加载markdown文件并转换
            fetch('./数字电子技术笔记总结.md')
                .then(response => response.text())
                .then(markdownText => {
                    const htmlContent = convertMarkdownToHTML(markdownText);
                    document.getElementById('content').innerHTML = htmlContent;
                    
                    // 添加平滑滚动
                    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                        anchor.addEventListener('click', function (e) {
                            e.preventDefault();
                            const target = document.querySelector(this.getAttribute('href'));
                            if (target) {
                                target.scrollIntoView({
                                    behavior: 'smooth',
                                    block: 'start'
                                });
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('Error loading markdown:', error);
                    document.getElementById('content').innerHTML = 
                        '<p style="color: red;">❌ 无法加载笔记内容，请确保markdown文件存在。</p>';
                });
        </script>
    </div>
</body>
</html>
