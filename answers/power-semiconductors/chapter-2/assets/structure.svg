 height="4" fill="#f4d285" stroke="#515b68" stroke-width="1.4" /><rect x="655" y="250" width="65" height="26" fill="#bcaed9" stroke="#515b68" stroke-width="1.4" /><rect x="655" y="276" width="65" height="4" fill="#f4d285" stroke="#515b68" stroke-width="1.4" /><path d="M830 280 L830 299 Q830 321 850 321 Q870 321 870 299 L870 280 Z" fill="#dfafb7" stroke="#a9616f" stroke-width="1.6" /><text x="850" y="341" font-size="18" text-anchor="middle" fill="#17202b" >FR1</text><path d="M960 280 L960 299 Q960 321 980 321 Q1000 321 1000 299 L1000 280 Z" fill="#dfafb7" stroke="#a9616f" stroke-width="1.6" /><text x="980" y="341" font-size="18" text-anchor="middle" fill="#17202b" >FR2</text><path d="M1090 280 L1090 299 Q1090 321 1110 321 Q1130 321 1130 299 L1130 280 Z" fill="#dfafb7" stroke="#a9616f" stroke-width="1.6" /><text x="1110" y="341" font-size="18" text-anchor="middle" fill="#17202b" >FR3</text><path d="M765 100 L765 142" fill="none" stroke="#7d8690" stroke-width="1" stroke-dasharray="5 5"/><text x="360" y="105" font-size="22" text-anchor="middle" fill="#17202b" >有源区：三个重复条形元胞剖面</text><text x="995" y="110" font-size="23" text-anchor="middle" fill="#17202b" >终端区：P⁺ 浮置场限环</text><text x="995" y="136" font-size="20" text-anchor="middle" fill="#17202b" >（Floating Field Rings）</text><text x="650" y="808" font-size="23" text-anchor="middle" fill="#17202b" >n⁺ 衬底（重掺杂 n 型）</text><text x="650" y="861" font-size="21" text-anchor="middle" fill="#fff" >D：背面漏极金属</text><text x="112" y="137" font-size="21" text-anchor="middle" fill="#17202b" >n⁺ 源区</text><text x="222" y="137" font-size="21" text-anchor="middle" fill="#17202b" >p⁺ 体接触区</text><text x="398" y="137" font-size="21" text-anchor="middle" fill="#17202b" >多晶硅栅极 G</text><text x="1258" y="165" font-size="20" text-anchor="start" fill="#17202b" >正面钝化层（绝缘保护）</text><text x="1258" y="207" font-size="21" text-anchor="start" fill="#17202b" >源极接触窗口</text><text x="1258" y="246" font-size="21" text-anchor="start" fill="#17202b" >层间绝缘介质</text><