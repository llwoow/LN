name: LN combined PR review
on:
  pull_request:
    paths:
      - 'courses/**'
      - 'answers/**'
      - 'output/pdf/**'
      - 'assets/practice/electrical-materials/**'
      - 'app.js'
      - 'styles.css'
      - 'practice.js'
      - 'resource-library.js'
      - 'index.html'
      - 'courses.js'
      - 'scripts/**'
      - 'tests/**'
      - 'PR-REVIEW-2026-11-13.md'
      - '.github/workflows/pr-review-nov13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reference and definition indexes
        run: |
          python scripts/build-reference-index.py --check
          python scripts/build-glossary.py --check
      - name: Existing behavior and reviewed scientific regressions
        run: |
          set -e
          python -m unittest discover -s tests -v
          for file in tests/*.test.cjs; do node "$file"; done
      - name: Build the exact combined source
        run: |
          python scripts/build-static.py
          git diff --exit-code -- courses/practice/bank.js courses/resources/catalog.js courses/power-semiconductors/lessons
      - name: Install browser tools and CJK print fonts
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Review new readings, definitions, collections and complete answer
        run: python tests/browser_review_nov13.py
      - name: Verify repository Pages subdirectory
        run: python tests/browser_smoke_pages.py
      - name: Preserve screenshots and actual verification scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ln-nov13-review
          path: |
            nov13-browser-artifacts/*.png
            nov13-browser-artifacts/*.json
          if-no-files-found: warn
