name: LN electrical materials review
on:
  pull_request:
    paths:
      - 'courses/electrical-materials/**'
      - 'courses/practice/**'
      - 'courses/resources/**'
      - 'assets/practice/electrical-materials/**'
      - 'index.html'
      - 'courses.js'
      - 'reference-index.js'
      - 'tests/electrical-materials.test.cjs'
      - 'tests/browser_smoke_electrical_materials.py'
      - '.github/workflows/electrical-materials-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  materials-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build-static.py
      - run: python -m pip install --disable-pip-version-check playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python tests/browser_smoke_electrical_materials.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ln-electrical-materials-first-pass
          path: electrical-materials-browser-artifacts/
          if-no-files-found: warn
