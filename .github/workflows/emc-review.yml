name: LN EMC full validation
on:
  pull_request:
    paths:
      - 'courses/electromagnetic-compatibility/**'
      - 'app.js'
      - 'courses.js'
      - 'index.html'
      - 'reference-index.js'
      - 'glossary-index.js'
      - 'tests/test_emc_course.py'
      - 'tests/browser_smoke_emc.py'
      - '.github/workflows/emc-review.yml'
  workflow_dispatch:
jobs:
  full-python-and-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Python unit test suite
        run: python -m unittest discover -s tests -v
      - name: Full native Node test suite
        run: |
          set -e
          for test_file in tests/*.test.cjs; do node "$test_file"; done
      - name: Check formula and figure index
        run: python scripts/build-reference-index.py --check
      - name: Check glossary index
        run: python scripts/build-glossary.py --check
      - name: Static build and generated data consistency
        run: |
          python scripts/build-static.py
          git diff --exit-code -- courses/practice/bank.js resource-library.js courses/highschool
  emc-browser-desktop-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Visit all EMC lessons and verify interactions at 3 viewports
        run: python tests/browser_smoke_emc.py
      - name: Upload inspected screenshots and JSON audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ln-emc-browser-review
          path: emc-browser-artifacts/
          if-no-files-found: warn
