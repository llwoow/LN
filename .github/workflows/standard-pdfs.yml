name: Generate LN training PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'print.js'
      - 'print.css'
      - 'courses/electromagnetic-compatibility/chapter1-tests*.js'
      - 'scripts/export-standard-papers.py'
      - '.github/workflows/standard-pdfs.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact static source
        run: python scripts/build-static.py
      - name: Install Chromium and Chinese fonts
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Produce six standard PDFs from a fresh browser
        run: |
          python scripts/export-standard-papers.py
          for f in pdf-output/*.pdf; do pdfinfo "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: LN-EMC-chapter1-PDF
          path: pdf-output/*.pdf
          retention-days: 30
