name: LN robot drive review
on:
  pull_request:
    paths:
      - 'courses/robot-drive-engineering/**'
      - 'courses/practice/**'
      - 'courses/resources/**'
      - 'scripts/build-robot-drive.py'
      - 'scripts/build-static.py'
      - 'app.js'
      - 'courses.js'
      - 'index.html'
      - 'tests/*robot*'
      - '.github/workflows/robot-drive-review.yml'
  workflow_dispatch:
jobs:
  correctness-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: |
          set -e
          for test_file in tests/*.test.cjs; do node "$test_file"; done
      - run: python scripts/build-reference-index.py --check
      - run: python scripts/build-glossary.py --check
      - run: |
          python scripts/build-static.py
          git diff --exit-code -- courses/robot-drive-engineering courses/practice/bank.js courses/resources/catalog.js
      - run: |
          cc -std=c11 -Wall -Wextra -Werror courses/robot-drive-engineering/files/c_foundations.c -o /tmp/rd-c
          /tmp/rd-c
          cc -std=c11 -Wall -Wextra -Werror courses/robot-drive-engineering/files/snapshot_demo.c -o /tmp/rd-snapshot
          /tmp/rd-snapshot
          python courses/robot-drive-engineering/files/embedded_replay.py
  browser-reading-and-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/build-static.py
      - run: python tests/browser_smoke_robot_drive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ln-robot-drive-browser-review
          path: robot-drive-browser-artifacts/
          if-no-files-found: warn
